<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fairy Chat - Image Composition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Lumen UI Styling - Glassmorphism */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('Screenshot 2026-08-02 105544.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
        }

        /* WebGL Canvas for particles */
        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .foreground {
            position: absolute;
            left: 10%;
            top: 50%;
            transform: translateY(-50%);
            z-index: 3;
            max-width: 35vw;
            max-height: 60vh;
            filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.4));
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(-50%) translateX(0); }
            50% { transform: translateY(-50%) translateX(10px); }
        }

        .foreground img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 20px;
        }

        /* Chatbot Container */
        .chatbot {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(20, 30, 48, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 20px;
            width: 90%;
            max-width: 700px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* Speech Bubble */
        .speech-bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 15px 20px;
            max-width: 350px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            opacity: 0;
            transform: scale(0.8) translateY(10px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 5;
            pointer-events: none;
        }

        .speech-bubble.active {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 30px;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.95);
            transform: rotate(45deg);
            border-right: 1px solid rgba(255, 255, 255, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        .speech-bubble-text {
            color: #1a1a2e;
            font-size: 14px;
            line-height: 1.5;
            font-weight: 500;
        }

        /* Chat Messages */
        .chat-messages {
            max-height: 150px;
            overflow-y: auto;
            margin-bottom: 15px;
            padding-right: 10px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

        .message {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 8px;
            color: white;
            font-size: 13px;
            animation: messageSlide 0.3s ease-out;
        }

        @keyframes messageSlide {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Input Area */
        .chat-input-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 12px 18px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .chat-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .chat-input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(100, 200, 255, 0.5);
            box-shadow: 0 0 15px rgba(100, 200, 255, 0.3);
        }

        .send-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 16px;
            padding: 12px 24px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .send-btn:active {
            transform: translateY(0);
        }

        /* LEMIN Animation for particles */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
            z-index: 2;
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <canvas id="webgl-canvas"></canvas>
    <div class="foreground">
        <img src="Copilot_20260805_104857.png" alt="Fairy">
    </div>

    <!-- Speech Bubble -->
    <div class="speech-bubble" id="speechBubble">
        <div class="speech-bubble-text" id="speechText"></div>
    </div>

    <!-- Chatbot -->
    <div class="chatbot">
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-container">
            <input type="text" class="chat-input" id="chatInput" placeholder="Type a message..." autocomplete="off">
            <button class="send-btn" id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        // WebGL Particle System for LEMIN animation
        const canvas = document.getElementById('webgl-canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

        if (gl) {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            gl.viewport(0, 0, canvas.width, canvas.height);

            const vertexShaderSource = `
                attribute vec2 aPosition;
                void main() {
                    gl_Position = vec4(aPosition, 0.0, 1.0);
                    gl_PointSize = 3.0;
                }
            `;

            const fragmentShaderSource = `
                precision mediump float;
                uniform float uTime;
                void main() {
                    vec2 center = gl_PointCoord - vec2(0.5);
                    float dist = length(center);
                    float alpha = 0.6 - dist * 1.2;
                    gl_FragColor = vec4(0.8, 0.9, 1.0, alpha);
                }
            `;

            function createShader(gl, type, source) {
                const shader = gl.createShader(type);
                gl.shaderSource(shader, source);
                gl.compileShader(shader);
                return shader;
            }

            const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
            const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);
            const program = gl.createProgram();
            gl.attachShader(program, vertexShader);
            gl.attachShader(program, fragmentShader);
            gl.linkProgram(program);
            gl.useProgram(program);

            const particles = [];
            const numParticles = 150;

            for (let i = 0; i < numParticles; i++) {
                particles.push({
                    x: Math.random() * 2 - 1,
                    y: Math.random() * 2 - 1,
                    vx: (Math.random() - 0.5) * 0.002,
                    vy: (Math.random() - 0.5) * 0.002,
                    life: Math.random()
                });
            }

            const positionBuffer = gl.createBuffer();
            const positions = new Float32Array(numParticles * 2);

            let lastTime = 0;
            const targetFPS = 60;
            const frameDelay = 1000 / targetFPS;

            function animateParticles(currentTime) {
                requestAnimationFrame(animateParticles);

                const deltaTime = currentTime - lastTime;
                if (deltaTime < frameDelay) return;
                lastTime = currentTime - (deltaTime % frameDelay);

                gl.clearColor(0, 0, 0, 0);
                gl.clear(gl.COLOR_BUFFER_BIT);
                gl.enable(gl.BLEND);
                gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

                const time = currentTime * 0.001;

                for (let i = 0; i < numParticles; i++) {
                    const p = particles[i];
                    p.x += p.vx + Math.sin(time + i) * 0.0005;
                    p.y += p.vy + Math.cos(time + i) * 0.0005;

                    if (p.x > 1 || p.x < -1) p.vx *= -1;
                    if (p.y > 1 || p.y < -1) p.vy *= -1;

                    positions[i * 2] = p.x;
                    positions[i * 2 + 1] = p.y;
                }

                gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
                gl.bufferData(gl.ARRAY_BUFFER, positions, gl.DYNAMIC_DRAW);

                const aPosition = gl.getAttribLocation(program, 'aPosition');
                gl.enableVertexAttribArray(aPosition);
                gl.vertexAttribPointer(aPosition, 2, gl.FLOAT, false, 0, 0);

                gl.drawArrays(gl.POINTS, 0, numParticles);
            }

            requestAnimationFrame(animateParticles);
        }

        // Chatbot Logic
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const speechBubble = document.getElementById('speechBubble');
        const speechText = document.getElementById('speechText');

        const botResponses = [
            "Hello! I'm your fairy guide! ✨",
            "Welcome to the magical world! 🌟",
            "How can I help you today?",
            "This is a Lumen-styled interface! 💫",
            "The WebGL particles are running smoothly!",
            "Click anywhere to see the magic!",
            "I'm here to assist you! ✨"
        ];

        function addMessage(text, isUser = true) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            messageDiv.textContent = (isUser ? 'You: ' : 'Fairy: ') + text;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showSpeechBubble(text) {
            speechText.textContent = text;
            speechBubble.style.left = '35%';
            speechBubble.style.top = '30%';
            speechBubble.classList.add('active');

            setTimeout(() => {
                speechBubble.classList.remove('active');
            }, 3000);
        }

        function handleSend() {
            const text = chatInput.value.trim();
            if (!text) return;

            addMessage(text, true);
            chatInput.value = '';

            setTimeout(() => {
                const response = botResponses[Math.floor(Math.random() * botResponses.length)];
                addMessage(response, false);
                showSpeechBubble(response);
            }, 500);
        }

        sendBtn.addEventListener('click', handleSend);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });

        // Initial greeting
        setTimeout(() => {
            const greeting = botResponses[0];
            addMessage(greeting, false);
            showSpeechBubble(greeting);
        }, 1000);

        // Handle window resize for WebGL
        window.addEventListener('resize', () => {
            if (gl) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                gl.viewport(0, 0, canvas.width, canvas.height);
            }
        });
    </script>
</body>
</html>
